# Free demo: four Render Free web services.
# First create four PostgreSQL databases on Neon Free and one CloudAMQP
# Little Lemur RabbitMQ instance. Enter their URLs when Render prompts.
# See FREE_DEPLOYMENT.md for sleep, quota, and startup instructions.
services:
  - type: web
    name: saga-orders
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    dockerCommand: /bin/sh -c 'node scripts/migrate-service.mjs order-orchestrator && exec node scripts/render-start.mjs order-orchestrator'
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - fromGroup: saga-backend-auth
      - key: REQUIRE_SERVICE_AUTH
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: RABBITMQ_PREFIX
        value: saga.free.v1

  - type: web
    name: saga-payment
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    dockerCommand: /bin/sh -c 'node scripts/migrate-service.mjs payment-service && exec node scripts/render-start.mjs payment-service'
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - fromGroup: saga-backend-auth
      - key: REQUIRE_SERVICE_AUTH
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: RABBITMQ_PREFIX
        value: saga.free.v1

  - type: web
    name: saga-inventory
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    dockerCommand: /bin/sh -c 'node scripts/migrate-service.mjs inventory-service && exec node scripts/render-start.mjs inventory-service'
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - fromGroup: saga-backend-auth
      - key: REQUIRE_SERVICE_AUTH
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: RABBITMQ_PREFIX
        value: saga.free.v1

  - type: web
    name: saga-shipping
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    dockerCommand: /bin/sh -c 'node scripts/migrate-service.mjs shipping-service && exec node scripts/render-start.mjs shipping-service'
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - fromGroup: saga-backend-auth
      - key: REQUIRE_SERVICE_AUTH
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: RABBITMQ_PREFIX
        value: saga.free.v1

envVarGroups:
  - name: saga-backend-auth
    envVars:
      - key: BACKEND_API_TOKEN
        generateValue: true
